<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJs — Pulse LDN</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="style.css?v=9" />
  <script src="theme.js"></script>
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
    <div class="blob blob-5"></div>
  </div>
  <nav>
    <div class="nav-links">
      <a href="index.html">Events</a>
      <a href="djs.html" class="active">DJs</a>
      <a href="about.html">About</a>
    </div>
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode"></button>
  </nav>

  <main>
    <div class="page-header">
      <h2>DJs we track</h2>
      <p id="djCount">Loading…</p>
    </div>

    <div class="dj-grid" id="djGrid">
      <!-- Populated by JS -->
    </div>

    <p style="text-align:center; margin-top:2.5rem; font-size:0.9rem; color:var(--text-muted);">
      Missing someone? <a href="about.html" style="color:var(--accent);">Suggest a DJ →</a>
    </p>
  </main>

  <script src="data/events.js"></script>
  <script>

      { name: "DESIREE",              slug: "desiree-rsa" },
      { name: "Black Coffee",         slug: "blackcoffee" },

      { name: "DaCapo",               slug: "dacapo" },
      { name: "Shimza",               slug: "shimza" },
      { name: "Zakes Bantwini",       slug: "zakesbantwini" },

      { name: "Artbat",               slug: "artbat" },
      { name: "Vintage Culture",      slug: "vintageculture" },
      { name: "RÜFÜS DU SOL",        slug: "rufusdusol" },
      { name: "Disclosure",           slug: "disclosure" },
      { name: "Solomun",              slug: "solomun" },
      { name: "CamelPhat",            slug: "camelphat" },
      { name: "Antdot",               slug: "antdot" },
      { name: "Alex Wann",            slug: "alexwann" },
      { name: "Bedouin",              slug: "bedouin" },

      { name: "Eric Prydz",           slug: "ericprydz" },
      { name: "Kasablanca",           slug: "kasablanca" },
      { name: "Lane 8",               slug: "lane8" },
      { name: "DJ Tennis",            slug: "djtennis" },
      { name: "Michael Bibi",         slug: "michaelbibi" },
      { name: "Mind Against",         slug: "mindagainst" },
      { name: "Miss Monique",         slug: "missmonique" },
      { name: "Monolink",             slug: "monolink" },
      { name: "Sammy Virji",          slug: "sammyvirji" },
      { name: "Seth Troxler",         slug: "sethtroxler" },
      { name: "Dennis Cruz",          slug: "denniscruz" },
      { name: "The Martinez Brothers",slug: "themartinezbros" },
      { name: "Sparrow & Barbossa",   slug: "sparrowbarbossa" },
      { name: "Boddhi Satva",         slug: "boddhisatva" },
      { name: "Themba",               slug: "themba" },
      { name: "FISHER",               slug: "fisheroz" },
      { name: "Chris Lake",           slug: "chrislake" },
      { name: "MK",                   slug: "marckinchen" },
      { name: "Dixon",                slug: "dixon" },
      { name: "Massano",              slug: "massano" },
      { name: "PAWSA",                slug: "pawsa" },
      { name: "ANOTR",                slug: "anotr" },
      { name: "Elderbrook",           slug: "elderbrook" },
    ];

    async function init() {
      const grid = document.getElementById('djGrid');
      const countEl = document.getElementById('djCount');

      // Try to use the djs array from JSON; fall back to hardcoded list
      let djs = DJ_LIST;
      try {
        let data = null;
        if (window.LONDON_NIGHTS_DATA) {
          data = window.LONDON_NIGHTS_DATA;
        } else {
          const res = await fetch(DATA_URL);
          if (res.ok) data = await res.json();
        }
        if (data && data.djs && data.djs.length > 0) {
          // Merge: prefer JSON profile data, but include any hardcoded DJ
          // not yet in the JSON (i.e. added to fetch_data.py but data not refreshed)
          const jsonSlugs = new Set(data.djs.map(d => d.slug));
          const missing = DJ_LIST.filter(d => !jsonSlugs.has(d.slug));
          djs = [...data.djs, ...missing];
        }
      } catch (_) {}

      const sorted = [...djs].sort((a, b) => a.name.localeCompare(b.name));
      countEl.textContent = `${sorted.length} DJs tracked across London`;

      grid.innerHTML = sorted.map(dj => `
        <a class="dj-card" href="dj.html?slug=${encodeURIComponent(dj.slug)}">
          <div class="dj-card-name">${escHtml(dj.name)}</div>
          <div class="dj-card-meta">ra.co/dj/${escHtml(dj.slug)}</div>
        </a>
      `).join('');

      // Defer so animations.js?v=2 (loaded after this script) is available
      setTimeout(function () {
        if (typeof window.animateDjGrid === 'function') window.animateDjGrid();
      }, 0);
    }

    function escHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    init();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="animations.js?v=2"></script>
</body>
</html>
